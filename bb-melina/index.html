/* Layout: colonna stretta; gli itinerari sono schede grandi, le tappe scorrono lungo una linea come le miglia di una strada romana. */

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 12px; border: 2px solid var(--accent); font: 600 17px var(--body); text-decoration: none; }

<button type="button" class="mode" id="mode"></button>
<div class="wrap">
  <div class="trial" id="trial" hidden></div>

g, um mit einem Aperitivo auf der kleinen Piazza in Monti zu enden."}, "attenzione": {"it": "Nelle chiese serve un abbigliamento rispettoso e durante le funzioni non si visita.", "en": "Dress respectfully in the churches; visits stop during services.", "fr": "Tenue correcte dans les églises ; pas de visite pendant les offices.", "de": "In den Kirchen angemessene Kleidung; während der Gottesdienste keine Besichtigung."}, "accesso": {"it": "Il rione è in collina: salite e sampietrini rendono alcuni tratti faticosi con passeggino o carrozzina.", "en": "The district is on a hill: slopes and cobblestones make some stretches tiring with a stroller or wheelchair.", "fr": "Le quartier est en colline : montées et pavés rendent certains tronçons fatigants avec poussette ou fauteuil.", "de": "Das Viertel liegt am Hang: Steigungen und Kopfsteinpflaster machen manche Abschnitte mit Kinderwagen oder Rollstuhl anstrengend."}, "bagni": {"it": "Pochi bagni pubblici lungo il percorso: conviene usare quelli di bar e locali, consumando qualcosa.", "en": "Few public toilets along the way: use those in bars and cafés, and buy something.", "fr": "Peu de toilettes publiques sur le parcours : utilisez celles des bars, en consommant quelque chose.", "de": "Unterwegs gibt es wenige öffentliche Toiletten: Am besten die in Bars nutzen und etwas bestellen."}, "bambini": {"it": "È l'itinerario con più chiese e qualche salita: alternate le visite con una pausa nella piazzetta di Monti.", "en": "This walk has the most churches and some slopes: alternate visits with a break in the little square in Monti.", "fr": "C'est l'itinéraire avec le plus d'églises et quelques montées : alternez les visites avec une pause sur la petite place de Monti.", "de": "Diese Route hat die meisten Kirchen und einige Steigungen: Besuche mit einer Pause auf dem kleinen Platz in Monti abwechseln."}}, "pioggia": [{"tipo": {"it": "Museo", "en": "Museum", "fr": "Musée", "de": "Museum"}, "nome": "Palazzo Massimo", "dest": "Pal ys", "fr": "≈ 3 km · de la Porta San Sebastiano à Capo di Bove · beaucoup de sites ferment le lundi", "de": "≈ 3 km · von der Porta San Sebastiano bis Capo di Bove · viele Stätten montags geschlossen"}, "trek": false, "info": {"durata": {"it": "4-5 ore con le catacombe", "en": "4-5 hours with the catacombs", "fr": "4 à 5 heures avec les catacombes", "de": "4-5 Stunden mit den Katakomben"}, "biglietti": {"it": "Catacombe di San Callisto 10 €, solo con guida. Villa di Massenzio gratuita.", "en": "Catacombs of St Callixtus €10, guided visits only. Villa of Maxentius is free.", "fr": "Catacombes de Saint-Calixte 10 €, visite guidée uniquement. Villa de Maxence gratuite.", "de": "Calixtus-Katakomben 10 €, nur mit Führung. Maxentiusvilla kostenlos."}, "quando": {"it": "La domenica e nei festivi l'Appia Antica è chiusa alle auto: è il giorno migliore per camminare.", "en": "On Sundays and public holidays the Appian Way is closed to cars: the best day to walk it.", "fr": "Le dimanche et les jours fériés, la voie Appienne est fermée aux voitures : le meilleur jour pour marcher.", "de": "Sonntags und an Feiertagen ist die Via Appia für Autos gesperrt: der beste Tag zum Gehen."}, "attenzione": {"it": "San Callisto chiude il mercoledì, molti altri siti il lunedì. Scarpe comode: il basolato romano è irregolare.", "en": "St Callixtus closes on Wednesdays, many other sites on Mondays. Wear comfortable shoes: the Roman paving is uneven.", "fr": "Saint-Calixte ferme le mercredi, beaucoup d'autres sites le lundi. Chaussures confortables : les pavés romains sont irréguliers.", "de": "San Callisto schließt mittwochs, viele andere Stätten montags. Bequeme Schuhe: Das römische Pflaster ist uneben."}, "accesso": {"it": "Il basolato romano è molto irregolare: difficile con passeggino o carrozzina nei tratti antichi.", "en": "The Roman paving is very uneven: hard with a stroller or wheelchair on the ancient stretches.", "fr": "Le pavage romain est très irrégulier : difficile avec poussette ou fauteuil sur les tronçons antiques.", "de": "Das römische Pflaster ist sehr uneben: In den antiken Abschnitten schwierig mit Kinderwagen oder Rollstuhl."}, "bagni": {"it": "Pochi servizi lungo la strada: conviene usare quelli di caffè e ristoranti quando ti fermi.", "en": "Few facilities along the road: use those in cafés and restaurants when you stop.", "fr": "Peu de services le long de la route : profitez de ceux des cafés et restaurants lors de vos pauses.", "de": "Wenig Infrastruktur an der Straße: Am besten die Toiletten in Cafés und Restaurants bei einer Pause nutzen."}, "bambini": {"it": "C'è molto spazio all'aperto, ma pochi servizi: portate acqua e merenda. Le catacombe sono buie e possono impressionare i più piccoli.", "en": "There is plenty of open space but few facilities: bring water and snacks. The catacombs are dark and may frighten younger children.", "fr": "Il y a beaucoup d'espace en plein air mais peu de services : prenez de l'eau et un goûter. Les catacombes sont sombres et peuvent impressionner les plus petits.", "de": "Viel Platz im Freien, aber wenig Infrastruktur: Wasser und Snacks mitnehmen. Die Katakomben sind dunkel und können kleine Kinder erschrecken."}}, "pioggia": [{"tipo": {"it": "Sotterranei", "en": "Underground", "fr": "Souterrains", "de": "Unterirdisch"}, "nome": "Catacombe di San Sebastiano", "dest": "Catacombe di San Sebastiano, Via Appia Antica 136, Roma", "testo": {"it": "Sulla via Appia, poco dopo San Callisto: gallerie sotterranee e tre mausolei romani dipinti. Solo visita guidata.", "en": "On the Appian Way, just past San Callisto: underground galleries and three painted Roman tombs. Guided tours only.", "fr": "Sur la voie Appienne, juste après San Callisto : galeries souterraines et trois mausolées romains peints. Visite guidée uniquement.", "de": "An der Via Appia, kurz nach San Callisto: unterirdische Gänge und drei bemalte römische Grabbauten. Nur mit Führung."}, "chiuso": "mon", "sito": "https://www.catacombe.org/"}, {"tipo": {"it": "Museo", "en": "Museum", "fr": "Musée", "de": "Museum"}, "nome": "Museo delle Mura", "dest": "Museo delle Mura, Via di Porta San Sebastiano 18, Roma", "testo": {"it": "Dentro Porta San Sebastiano: si cammina sul camminamento delle Mura Aureliane, al riparo, con vista sull'Appia.", "en": "Inside Porta San Sebastiano: walk along the sheltered walkway of the Aurelian Walls, looking out over the Appian Way.", "fr": "Dans la Porta San Sebastiano : on marche à l'abri sur le chemin de ronde du mur d'Aurélien, avec vue sur la voie Appienne.", "de": "In der Porta San Sebastiano: ein überdachter Gang auf der Aurelianischen Mauer mit Blick auf die Via Appia."}, "chiuso": "mon", "sito": "https://www.museodellemuraroma.it/"}], "bici": {"top_t": {"it": "Consigliato in bici", "en": "Best by bike", "fr": "Idéal à vélo", "de": "Am besten mit dem Rad"}, "top_d": {"it": "L'Appia è lunga e in gran parte dritta: in bici arrivi più lontano e con meno fatica. Puoi noleggiarla lungo il percorso.", "en": "The Appian Way is long and mostly straight: by bike you go further with less effort. You can rent one along the route.", "fr": "La voie Appienne est longue et presque droite : à vélo, on va plus loin avec moins d'effort. Vous pouvez en louer un sur le parcours.", "de": "Die Via Appia ist lang und meist gerade: Mit dem Rad kommen Sie weiter und sparen Kraft. Räder können Sie unterwegs mieten."}, "top_btn": {"it": "Vedi i noleggi", "en": "See the rentals", "fr": "Voir les loueurs", "de": "Verleihe ansehen"}, "sez_t": {"it": "In bici sull'Appia", "en": "Cycling the Appian Way", "fr": "La voie Appienne à vélo", "de": "Mit dem Rad auf der Via Appia"}, "sez_d": {"it": "Due noleggi lungo la strada: controlla orari e disponibilità prima di partire. Sul basolato romano, irregolare, si pedala piano.", "en": "Two rentals along the road: check opening hours and availability before you set off. The Roman paving is uneven, so ride slowly.", "fr": "Deux loueurs sur la route : vérifiez le // Meteo da MET Norway (dati CC BY 4.0): una richiesta dal browser, conservata 30 minuti. Se non risponde, il riquadro non compare.
let meteoDati = null;
const M_S = b => `<svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${b}</svg>`;
const M_NUBE = y => `<path transform="translate(0 ${y})" d="M7 18h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 9.5 4.3 4.3 0 0 0 7 18z" fill="#DDE2DD" stroke="#7C8782"/>`;
const M_SOLE = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#F2BC3E" stroke="#C98A16"/>`;
const M_LUNA = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.500 10.500z" fill="#F0CF72" stroke="#B98B22"/>';
function meteoIcona(c) {
  c = c || "";
  if (c.includes("thunder")) return M_S(M_NUBE(-3) + '<path d="M13 13l-3 4h3l-2 4" fill="none" stroke="#C98A16" stroke-width="1.8"/>');
  if (c.includes("snow") || c.includes("sleet")) return M_S(M_NUBE(-3) + '<path d="M9 19h.01M12 21h.01M15 19h.01" fill="none" stroke="#5F93B8" stroke-width="2.4"/>');
  if (c.includes("rain")) return M_S(M_NUBE(-3) + '<path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3" fill="none" stroke="#3F86B5" stroke-width="1.8"/>');
  if (c.includes("fog")) return M_S('<path d="M4 9h16M6 13h12M4 17h16" fill="none" stroke="#7C8782" stroke-width="2"/>');
  if (c.includes("cloudy") && !c.includes("partly")) return M_S(M_NUBE(0));
  if (c.includes("partly") || c.includes("fair")) return M_S((c.includes("night") ? '<path d="M14 9A6 6 0 1 1 6 2.500a5 5 0 0 0 8 6.500z" fill="#F0CF72" stroke="#B98B22"/>' : M_SOLE(8, 8, 4.5)) + M_NUBE(2));
  if (c.includes("night")) return M_S(M_LUNA);
  return M_S(M_SOLE(12, 12, 4.5) + '<path d="M12 2.500v2M12 19.500v2M5.300 5.300l1.400 1.400M17.300 17.300l1.400 1.400M2.500 12h2M19.500 12h2M5.300 18.700l1.400-1.400M17.300 6.700l1.400-1.400" fill="none" stroke="#C98A16"/>');
}
function disegnaMeteo() {
  const box = document.getElementById("meteo");
  if (!meteoDati || !METEO) { box.hidden = true; return; }
  const u = UI[LANG], ora = Date.now() - 3600000;
  const serie = meteoDati.filter(p => new Date(p.time).getTime() >= ora);
  if (serie.length < 10) { box.hidden = true; return; }
  const cella = p => ({ t: Math.round(p.data.instant.details.air_temperature), c: ((p.data.next_1_hours || p.data.next_6_hours || {}).summary || {}).symbol_code });
  const adesso = cella(serie[0]);
  const ore = new Intl.DateTimeFormat(LANG, { hour: "2-digit", minute: "2-digit", timeZone: METEO.tz });
  const poi = [3, 6, 9].map(i => { const c = cella(serie[i]); return `<span class="m-poi"><small>${esc(ore.format(new Date(serie[i].time)))}</small>${meteoIcona(c.c)}<b>${c.t}°</b></span>`; }).join("");
  box.innerHTML = `<span class="m-ora"><small>${esc(METEO.nome[LANG])}</small>${meteoIcona(adesso.c)}<b>${adesso.t}°</b></span>${poi}<a class="m-fonte" href="https://www.met.no/en" target="_blank" rel="noopener">MET Norway</a>`;
  box.hidden = false;
}
function caricaMeteo() {
  if (!METEO) return;
  const chiave = "meteo-" + METEO.tz;
  try { const c = JSON.parse(localStorage.getItem(chiave) || "null"); if (c && Date.now() - c.quando < 1800000) { meteoDati = c.serie; disegnaMeteo(); return; } } catch (e) {}
  fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${METEO.lat}&lon=${METEO.lon}`)
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(d => { meteoDati = d.properties.timeseries.slice(0, 24); try { localStorage.setItem(chiave, JSON.stringify({ quando: Date.now(), serie: meteoDati })); } catch (e) {} disegnaMeteo(); })
    .catch(() => {});
}
