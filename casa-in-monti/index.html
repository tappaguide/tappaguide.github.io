g, um mit einem Aperitivo auf der kleinen Piazza in Monti zu enden."}, "attenzione": {"it": "Nelle chiese serve un abbigliamento rispettoso e durante le funzioni non si visita.", "en": "Dress respectfully in the churches; visits stop during services.", "fr": "Tenue correcte dans les églises ; pas de visite pendant les offices.", "de": "In den Kirchen angemessene Kleidung; während der Gottesdienste keine Besichtigung."}, "accesso": {"it": "Il rione è in collina: salite e sampietrini rendono alcuni tratti faticosi con passeggino o carrozzina.", "en": "The district is on a hill: slopes and cobblestones make some stretches tiring with a stroller or wheelchair.", "fr": "Le quartier est en colline : montées et pavés rendent certains tronçons fatigants avec poussette ou fauteuil.", "de": "Das Viertel liegt am Hang: Steigungen und Kopfsteinpflaster machen manche Abschnitte mit Kinderwagen oder Rollstuhl anstrengend."}, "bagni": {"it": "Pochi bagni pubblici lungo il percorso: conviene usare quelli di bar e locali, consumando qualcosa.", "en": "Few public toilets along the way: use those in bars and cafés, and buy something.", "fr": "Peu de toilettes publiques sur le parcours : utilisez celles des bars, en consommant quelque chose.", "de": "Unterwegs gibt es wenige öffentliche Toiletten: Am besten die in Bars nutzen und etwas bestellen."}, "bambini": {"it": "È l'itinerario con più chiese e qualche salita: alternate le visite con una pausa nella piazzetta di Monti.", "en": "This walk has the most churches and some slopes: alternate visits with a break in the little square in Monti.", "fr": "C'est l'itinéraire avec le plus d'églises et quelques montées : alternez les visites avec une pause sur la petite place de Monti.", "de": "Diese Route hat die meisten Kirchen und einige Steigungen: Besuche mit einer Pause auf dem kleinen Platz in Monti abwechseln."}}, "pioggia": [{"tipo": {"it": "Museo", "en": "Museum", "fr": "Musée", "de": "Museum"}, "nome": "Palazzo Massimo", "dest": "Pal ys", "fr": "≈ 3 km · de la Porta San Sebastiano à Capo di Bove · beaucoup de sites ferment le lundi", "de": "≈ 3 km · von der Porta San Sebastiano bis Capo di Bove · viele Stätten montags geschlossen"}, "trek": false, "info": {"durata": {"it": "4-5 ore con le catacombe", "en": "4-5 hours with the catacombs", "fr": "4 à 5 heures avec les catacombes", "de": "4-5 Stunden mit den Katakomben"}, "biglietti": {"it": "Catacombe di San Callisto 10 €, solo con guida. Villa di Massenzio gratuita.", "en": "Catacombs of St Callixtus €10, guided visits only. Villa of Maxentius is free.", "fr": "Catacombes de Saint-Calixte 10 €, visite guidée uniquement. Villa de Maxence gratuite.", "de": "Calixtus-Katakomben 10 €, nur mit Führung. Maxentiusvilla kostenlos."}, "quando": {"it": "La domenica e nei festivi l'Appia Antica è chiusa alle auto: è il giorno migliore per camminare.", "en": "On Sundays and public holidays the Appian Way is closed to cars: the best day to walk it.", "fr": "Le dimanche et les jours fériés, la voie Appienne est fermée aux voitures : le meilleur jour pour marcher.", "de": "Sonntags und an Feiertagen ist die Via Appia für Autos gesperrt: der beste Tag zum Gehen."}, "attenzione": {"it": "San Callisto chiude il mercoledì, molti altri siti il lunedì. Scarpe comode: il basolato romano è irregolare.", "en": "St Callixtus closes on Wednesdays, many other sites on Mondays. Wear comfortable shoes: the Roman paving is uneven.", "fr": "Saint-Calixte ferme le mercredi, beaucoup d'autres sites le lundi. Chaussures confortables : les pavés romains sont irréguliers.", "de": "San Callisto schließt mittwochs, viele andere Stätten montags. Bequeme Schuhe: Das römische Pflaster ist uneben."}, "accesso": {"it": "Il basolato romano è molto irregolare: difficile con passeggino o carrozzina nei tratti antichi.", "en": "The Roman paving is very uneven: hard with a stroller or wheelchair on the ancient stretches.", "fr": "Le pavage romain est très irrégulier : difficile avec poussette ou fauteuil sur les tronçons antiques.", "de": "Das römische Pflaster ist sehr uneben: In den antiken Abschnitten schwierig mit Kinderwagen oder Rollstuhl."}, "bagni": {"it": "Pochi servizi lungo la strada: conviene usare quelli di caffè e ristoranti quando ti fermi.", "en": "Few facilities along the road: use those in cafés and restaurants when you stop.", "fr": "Peu de services le long de la route : profitez de ceux des cafés et restaurants lors de vos pauses.", "de": "Wenig Infrastruktur an der Straße: Am besten die Toiletten in Cafés und Restaurants bei einer Pause nutzen."}, "bambini": {"it": "C'è molto spazio all'aperto, ma pochi servizi: portate acqua e merenda. Le catacombe sono buie e possono impressionare i più piccoli.", "en": "There is plenty of open space but few facilities: bring water and snacks. The catacombs are dark and may frighten younger children.", "fr": "Il y a beaucoup d'espace en plein air mais peu de services : prenez de l'eau et un goûter. Les catacombes sont sombres et peuvent impressionner les plus petits.", "de": "Viel Platz im Freien, aber wenig Infrastruktur: Wasser und Snacks mitnehmen. Die Katakomben sind dunkel und können kleine Kinder erschrecken."}}, "pioggia": [{"tipo": {"it": "Sotterranei", "en": "Underground", "fr": "Souterrains", "de": "Unterirdisch"}, "nome": "Catacombe di San Sebastiano", "dest": "Catacombe di San Sebastiano, Via Appia Antica 136, Roma", "testo": {"it": "Sulla via Appia, poco dopo San Callisto: gallerie sotterranee e tre mausolei romani dipinti. Solo visita guidata.", "en": "On the Appian Way, just past San Callisto: underground galleries and three painted Roman tombs. Guided tours only.", "fr": "Sur la voie Appienne, juste après San Callisto : galeries souterraines et trois mausolées romains peints. Visite guidée uniquement.", "de": "An der Via Appia, kurz nach San Callisto: unterirdische Gänge und drei bemalte römische Grabbauten. Nur mit Führung."}, "chiuso": "mon", "sito": "https://www.catacombe.org/"}, {"tipo": {"it": "Museo", "en": "Museum", "fr": "Musée", "de": "Museum"}, "nome": "Museo delle Mura", "dest": "Museo delle Mura, Via di Porta San Sebastiano 18, Roma", "testo": {"it": "Dentro Porta San Sebastiano: si cammina sul camminamento delle Mura Aureliane, al riparo, con vista sull'Appia.", "en": "Inside Porta San Sebastiano: walk along the sheltered walkway of the Aurelian Walls, looking out over the Appian Way.", "fr": "Dans la Porta San Sebastiano : on marche à l'abri sur le chemin de ronde du mur d'Aurélien, avec vue sur la voie Appienne.", "de": "In der Porta San Sebastiano: ein überdachter Gang auf der Aurelianischen Mauer mit Blick auf die Via Appia."}, "chiuso": "mon", "sito": "https://www.museodellemuraroma.it/"}], "bici": {"top_t": {"it": "Consigliato in bici", "en": "Best by bike", "fr": "Idéal à vélo", "de": "Am besten mit dem Rad"}, "top_d": {"it": "L'Appia è lunga e in gran parte dritta: in bici arrivi più lontano e con meno fatica. Puoi noleggiarla lungo il percorso.", "en": "The Appian Way is long and mostly straight: by bike you go further with less effort. You can rent one along the route.", "fr": "La voie Appienne est longue et presque droite : à vélo, on va plus loin avec moins d'effort. Vous pouvez en louer un sur le parcours.", "de": "Die Via Appia ist lang und meist gerade: Mit dem Rad kommen Sie weiter und sparen Kraft. Räder können Sie unterwegs mieten."}, "top_btn": {"it": "Vedi i noleggi", "en": "See the rentals", "fr": "Voir les loueurs", "de": "Verleihe ansehen"}, "sez_t": {"it": "In bici sull'Appia", "en": "Cycling the Appian Way", "fr": "La voie Appienne à vélo", "de": "Mit dem Rad auf der Via Appia"}, "sez_d": {"it": "Due noleggi lungo la strada: controlla orari e disponibilità prima di partire. Sul basolato romano, irregolare, si pedala piano.", "en": "Two rentals along the road: check opening hours and availability before you set off. The Roman paving is uneven, so ride slowly.", "fr": "Deux loueurs sur la route : vérifiez le     from.hidden = false; from.href = routeUrl(I.tappe[0].dest, H.addr); from.innerHTML = ICON_ROUTE + esc(u.from_host);
    bus.hidden = false; bus.href = routeUrl(I.tappe[0].dest, H.addr).replace("travelmode=walking", "travelmode=transit").replace("dirflg=w", "dirflg=r"); bus.innerHTML = ICON_ROUTE + esc(u.from_bus);
    document.getElementById("tiptext").textContent = u.tip;
  } else {
    trial.hidden = true; from.hidden = true; bus.hidden = true; stay.hidden = true;
    av.className = "avatar"; av.innerHTML = LOGO; av.setAttribute("aria-hidden", "true"); bn.textContent = "Tappa · Roma";
    document.getElementById("tiptext").textContent = u.tip;
  }
  document.getElementById("tabs").innerHTML = DATA.map((d, i) =>
    `${tabSep(d, u)}<button type="button" data-it="${i}" aria-pressed="${i === IT}"${tabClass(i === NEAR, d.icona, d.trek)}>${tabIcona(d.icona)}${i === NEAR ? `<em class="nb">${ICON_MAP}${esc(u.near)}</em>` : ""}<small>${d.trek ? esc(u.trek_k) : esc(u.it_k) + " " + (i + 1)}</small><span>${esc(d.nome[LANG])}</span></button>`).join("");
  document.getElementById("tabs").insertAdjacentHTML("beforeend", BLOCCATI.map(b => `${tabSep(b, u)}<button type="button" disabled${tabClass(false, b.icona, b.trek)}>${tabIcona(b.icona)}<small>${esc(u.locked)}</small><span>${esc(b.nome[LANG])}</span></button>`).join(""));
  const ln = document.getElementById("lockednote"); ln.hidden = !BLOCCATI.length; ln.textContent = u.locked_note;
  const nl = document.getElementById("nearline"); nl.hidden = IT !== NEAR; nl.innerHTML = ICON_MAP + esc(u.nearline);
  document.getElementById("hero").innerHTML = ILL[IT] + `<figcaption>${esc(ILL_NOME[IT])}</figcaption>`;
  document.getElementById("iname").textContent = I.nome[LANG];
  const tp = I.tappe, ultima = [...tp].reverse().find(t => !t.locale);
  document.getElementById("facts").innerHTML =
    `<span class="fact km">${ICON_WALK}<b>≈ ${I.km} km</b></span>` +
    `<span class="fact route"><span class="pt"><small>${esc(u.start)}</small>${esc(HOST && HOSTS[HOST].startHere ? HOSTS[HOST].name : tp[0].nome[LANG])}</span><span class="arr" aria-hidden="true">→</span><span class="pt"><small>${esc(u.end)}</small>${esc(ultima.nome[LANG])}</span></span>` +
    (I.nota[LANG] ? `<span class="fact warn">${ICON_ALERT}${esc(I.nota[LANG])}</span>` : "");
  const L = INFOL[LANG], sosta = I.tappe.find(t => t.locale);
  const righe = [[L.durata, I.info.durata[LANG]], [L.tappe, I.tappe.length + (sosta ? " · " + L.sosta + ": " + sosta.nome[LANG] : "")],
                 [L.biglietti, I.info.biglietti[LANG]], [L.quando, I.info.quando[LANG]], [L.attenzione, I.info.attenzione[LANG]]];
  if (I.info.accesso) righe.push([L.accesso, I.info.accesso[LANG]]);
  if (I.info.bagni) righe.push([L.bagni, I.info.bagni[LANG]]);
  if (I.info.bambini) righe.push([L.bambini, I.info.bambini[LANG]]);
  if (I.controllato) righe.push([L.controllato, I.controllato]);
  document.getElementById("info").innerHTML = `<h3>${esc(L.box)}</h3><dl>${righe.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
  const d = I.tappe.map(t => t.dest), all = document.getElementById("allroute");
  const da = HOST && HOSTS[HOST].startHere ? HOSTS[HOST].addr : d[0], tappeV = HOST && HOSTS[HOST].startHere ? d.slice(0, -1) : d.slice(1, -1);
  all.href = "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(da) + "&destination=" + encodeURIComponent(d[d.length - 1]) + "&waypoints=" + encodeURIComponent(tappeV.join("|")) + "&travelmode=walking";
  all.innerHTML = ICON_ROUTE + esc(u.all);
  document.getElementById("allnote").innerHTML = `<span class="cico">${ICON_INFO}</span><div><b>${esc(u.allk)}</b><span>${esc(u.allnote)}</span></div>`;
  const vie = d => `<div class="via"><small>${esc(u.appk)}</small><div class="due">${["google", "apple"].map(a =>
      `<a class="btn ${APP === a ? "p" : "g"}" data-app="${a}" href="${routeUrl(d, null, a)}" target="_blank" rel="noopener">${esc(a === "google" ? u.gs : u.as)}</a>`).join("")}</div></div>`;
  document.getElementById("stops").innerHTML = I.tappe.map((t, i) => `
    <li class="stop${t.locale ? " food" : ""}">
      <div class="dot">${i + 1}</div>
      <div>
        ${t.locale ? `<span class="tag">${esc(t.sponsor ? u.partner : u.food)}${t.prezzo ? " · " + t.prezzo : ""}</span>` : ""}
        <div class="th"><span class="ico">${ICONE[t.ico]}</span><h3>${esc(t.nome[LANG])}</h3></div>
        <p>${esc(t.testo[LANG])}</p>
        ${t.chiuso ? `<div class="chips"><span class="chip">${esc(u.closed)} ${esc(DOW[t.chiuso][LANG])}</span></div>` : ""}
        <div class="actions">
          ${vie(t.dest)}
          ${t.uff ? `<a class="btn t" href="${t.uff[1]}" target="_blank" rel="noopener">${ICON_TICKET}${esc(t.uff[0] === "b" ? u.tickets : u.official)}</a>` : ""}
          ${t.wiki ? `<a class="btn g" href="${wiki(t.wiki[LANG])}" target="_blank" rel="noopener">${ICON_BOOK}${esc(u.more)}</a>`
                   : `<a class="btn g" href="${mapSearch(t.dest)}" target="_blank" rel="noopener">${ICON_MAP}${esc(u.more)}</a>`}
        </div>
      </div>
    </li>`).join("");
  const rain = document.getElementById("rain"), eat = document.getElementById("eat");
  const scheda = (x, kind) => `<div class="card">${x.tipo ? `<span class="k">${esc(x.tipo[LANG])}${x.prezzo ? ` · <b class="eur">${x.prezzo}</b>` : ""}</span>` : ""}<b>${esc(x.nome)}</b><p>${esc(x.testo[LANG])}</p>
      ${x.chiuso ? `<div class="chips"><span class="chip">${esc(u.closed)} ${esc(DOW[x.chiuso][LANG])}</span></div>` : ""}
      <div class="row"><a class="btn p" href="${routeUrl(x.dest)}" target="_blank" rel="noopener">${ICON_ROUTE}${esc(u.route)}</a>
      ${x.sito ? `<a class="btn g" href="${x.sito}" target="_blank" rel="noopener">${ICON_BOOK}${esc(u.official)}</a>` : `<a class="btn g" href="${mapSearch(x.dest)}" target="_blank" rel="noopener">${ICON_MAP}${esc(u.more)}</a>`}</div></div>`;
  rain.hidden = !I.pioggia; eat.hidden = !I.fine;
  if (I.pioggia) rain.innerHTML = `<h3><span class="ico">${ICONE.pioggia}</span>${esc(u.rain_k)}</h3><p>${esc(u.rain_sub)}</p>` + I.pioggia.map(x => scheda(x)).join("");
  if (I.fine) eat.innerHTML = `<h3><span class="ico">${ICONE.cibo}</span>${esc(u.eat_k)}</h3><p>${esc(u.eat_sub)}</p>${I.fine.some(x => x.prezzo) ? `<div class="leg"><span class="lk">${esc(u.p_k)}</span><span><b>€</b> ${esc(u.p_1)}</span><span><b>€€</b> 15-35</span><span><b>€€€</b> ${esc(u.p_3)}</span></div>` : ""}` + I.fine.map(x => scheda(x)).join("");
  if (I.diete) eat.insertAdjacentHTML("beforeend", [["veg", u.d_veg], ["vegan", u.d_vegan], ["gf", u.d_gf]].filter(([k]) => I.diete[k].length).map(([k, n]) =>
    `<details class="dieta"><summary>${esc(n)} <span>(${I.diete[k].length})</span></summary>${k === "gf" ? `<p>${esc(u.d_gf_nota)}</p>` : ""}${I.diete[k].map(x => scheda(x)).join("")}</details>`).join(""));
  const picks = document.getElementById("picks"), miei = (HOST && HOSTS[HOST].consigli) || [];
  // in prova il riquadro resta visibile anche vuoto, con una frase neutra; le abbonate senza consigli non lo mostrano
  const vuoto = HOST && !miei.length && !HOSTS[HOST].abbonata;
  picks.hidden = !miei.length && !vuoto;
  if (vuoto) picks.innerHTML = `<h3><span class="ico">${ICONE.cibo}</span>${esc(u.picks_k)} ${esc(HOSTS[HOST].name)}</h3><p>${esc(u.picks_vuoto)}</p>`;
  if (miei.length) picks.innerHTML = `<h3><span class="ico">${ICONE.cibo}</span>${esc(u.picks_k)} ${esc(HOSTS[HOST].name)}</h3><p>${esc(u.picks_sub)}</p>` + miei.map(x => scheda(x)).join("");
  const bt = document.getElementById("bicitop"), bs = document.getElementById("bici"), B = I.bici;
  bt.hidden = bs.hidden = !B;
  if (B) {
    bt.innerHTML = `<div class="callout"><span class="cico">${ICON_BIKE}</span><div><b>${esc(B.top_t[LANG])}</b><span>${esc(B.top_d[LANG])}</span></div></div><button type="button" class="btn g" data-salta="bici" style="cursor:pointer">${esc(B.top_btn[LANG])} ↓</button>`;
    bs.innerHTML = `<h3><span class="ico">${ICON_BIKE}</span>${esc(B.sez_t[LANG])}</h3>` +
      `<div class="card"><b>${esc(B.prosegui_t[LANG])}</b><p>${esc(B.prosegui_d[LANG])}</p><ul style="margin:0;padding-left:20px;font-size:16px;display:grid;gap:6px">${B.mete.map(m => `<li><b style="font-size:inherit">${esc(m.nome[LANG])}</b>: ${esc(m.testo[LANG])}</li>`).join("")}</ul>
      <div class="row"><a class="btn p" href="${routeUrl(B.arrivo, B.partenza)}" target="_blank" rel="noopener">${ICON_ROUTE}${esc(B.prosegui_btn[LANG])}</a></div></div>` +
      `<p>${esc(B.sez_d[LANG])}</p>` + B.noleggi.map(x => scheda(x)).join("");
  }
  const rit = document.getElementById("ritorno"); rit.hidden = !HOST;
  // dalla posizione del telefono: a fine itinerario l'ospite è all'ultima tappa, o più avanti se ha proseguito
  if (HOST) rit.innerHTML = `<a class="btn p" href="${routeUrl(HOSTS[HOST].addr)}" target="_blank" rel="noopener">${ICON_ROUTE}${esc(u.back)}</a><a class="btn g" href="${routeUrl(HOSTS[HOST].addr).replace("travelmode=walking", "travelmode=transit").replace("dirflg=w", "dirflg=r")}" target="_blank" rel="noopener">${ICON_ROUTE}${esc(u.back_bus)}</a>`;
  const ios = /iPhone|iPad|Macintosh/.test(navigator.userAgent);
  const q = encodeURIComponent(WATER.q);
  // la ricerca è ancorata alla città della guida: senza, le mappe cercano nell'ultima zona vista (es. Roma aprendo la guida di Madrid)
  const ll = METEO ? METEO.lat + "," + METEO.lon : "";
  const vicino = APP === "apple" ? "https://maps.apple.com/?q=" + q + (ll ? "&sll=" + ll + "&z=14" : "")
    : (ll ? "https://www.google.com/maps/search/" + q + "/@" + ll + ",14z" : "https://www.google.com/maps/search/?api=1&query=" + q);
  document.getElementById("water").innerHTML = `<a class="btn w" href="${vicino}" target="_blank" rel="noopener">${ICON_DROP}${esc(WATER.near[LANG])}</a>` +
    (WATER.app ? `<a class="btn g" href="${ios ? WATER.app.ios : WATER.app.android}" target="_blank" rel="noopener">${ICON_MAP}${esc(WATER.app.label[LANG])}</a>` : "");
  // il numero di tappe è quello dell'itinerario aperto: lo diciamo, per non farlo sembrare il totale della guida
  const voci = [["stops", ICON_WALK, (I.trek ? u.trek_k : u.it_k + " " + (IT + 1)) + " · " + I.tappe.length + " " + u.s_tappe, u.s_tappe_sub]];
  if (I.bici) voci.push(["bici", ICON_BIKE, I.bici.salta_t[LANG], I.bici.salta_d[LANG]]);
  if (I.fine) voci.push(["eat", ICONE.cibo, u.s_eat, I.fine.length + " " + u.s_eat_sub]);
  if (I.pioggia) voci.push(["rain", ICONE.pioggia, u.s_rain, I.pioggia.length + " " + u.s_rain_sub]);
  if (!document.getElementById("picks").hidden) voci.push(["picks", ICON_STAR, u.s_picks, u.s_picks_sub]);
  document.getElementById("salta").innerHTML = `<h3>${esc(u.s_k)}</h3><div class="voci">` + voci.map(([id, ico, a, b]) => `<button type="button" data-salta="${id}"><span class="sic">${ico}</span><span><b>${esc(a)}</b><small>${esc(b)}</small></span></button>`).join("") + "</div>";
  const pr = document.getElementById("prossimo"); pr.hidden = !I.fine; pr.textContent = u.prossimo + " ↓";
  disegnaMeteo();
  document.title = HOST ? "Roma a piedi · " + HOSTS[HOST].name : "Tappa Roma";
  setModeLabel();
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { LANG = b.dataset.lang; store.set("tr-lang", LANG); render(); }));
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-it]"); if (!b) return; IT = +b.dataset.it; render(); document.getElementById("iname").scrollIntoView({ behavior: "smooth", block: "start" }); });
document.getElementById("stops").addEventListener("click", e => { const b = e.target.closest("[data-app]"); if (!b) return; APP = b.dataset.app; store.set("tr-app", APP); setTimeout(render, 300); });
document.addEventListener("click", e => { const b = e.target.closest("[data-salta]"); if (b) document.getElementById(b.dataset.salta).scrollIntoView({ behavior: "smooth", block: "start" }); });
window.addEventListener("hashchange", () => { pickHost(); render(); });

const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const modeBtn = document.getElementById("mode");
let MODE = store.get("tr-mode") === "dark" ? "dark" : "light";
function setModeLabel() { const L = { it: ["Modalità scura", "Modalità chiara"], en: ["Dark mode", "Light mode"], fr: ["Mode sombre", "Mode clair"], de: ["Dunkler Modus", "Heller Modus"] }[LANG]; modeBtn.setAttribute("aria-label", L[MODE === "dark" ? 1 : 0]); }
function applyMode() { if (MODE === "dark") document.documentElement.setAttribute("data-mode", "dark"); else document.documentElement.removeAttribute("data-mode"); modeBtn.innerHTML = MODE === "dark" ? SUN : MOON; setModeLabel(); store.set("tr-mode", MODE); }
modeBtn.addEventListener("click", () => { MODE = MODE === "dark" ? "light" : "dark"; applyMode(); });
let lastY = window.scrollY, tick = false;
window.addEventListener("scroll", () => { if (tick) return; tick = true; requestAnimationFrame(() => { const y = window.scrollY;
  if (y > lastY + 4 && y > 60) modeBtn.classList.add("away"); else if (y < lastY - 4 || y <= 60) modeBtn.classList.remove("away"); lastY = y; tick = false; }); }, { passive: true });

pickHost();
const itq = DATA.findIndex(i => i.id === new URLSearchParams(location.search).get("it"));   // ?it=monti apre quell'itinerario
if (itq >= 0) IT = itq;
applyMode(); render(); caricaMeteo();
</script>
