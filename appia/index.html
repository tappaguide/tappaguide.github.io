<style>
/* Layout: una colonna stretta come una strada; le tappe scorrono lungo una linea con i miliari romani a sinistra. */
:root {
  --bg: #FFFFFF;        /* versione bianca, sempre chiara */
  --surface: #F5F6F3;
  --ink: #1E2225;       /* basolato */
  --muted: #59615D;
  --line: #C6CBC3;
  --pine: #2D5843;      /* pino domestico */
  --pine-ink: #F2F6F1;
  --ochre: #8F6219;     /* incisione sui miliari */
  --display: "Marcellus", "Trajan Pro", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
:root { color-scheme: light; }
:root[data-mode="dark"] {
  --bg: #121514; --surface: #1B1F1D; --ink: #E6E8E3; --muted: #9AA39D;
  --line: #323835; --pine: #82B898; --pine-ink: #0E1913; --ochre: #D7AC62;
  color-scheme: dark;
}
.mode {
  position: fixed; z-index: 20;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.12);
}
.mode svg { width: 20px; height: 20px; }
.mode.away { transform: translateY(calc(-100% - 24px - env(safe-area-inset-top, 0px))); opacity: 0; pointer-events: none; }
.mode:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { .mode { transition: transform .25s ease, opacity .25s ease; } }
.demo { margin-right: 54px; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.55;
}
.wrap {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.demo {
  font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ochre); border: 1px dashed var(--ochre); border-radius: 6px;
  padding: 8px 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between;
}
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
.host { font-size: 14px; color: var(--muted); }
.host b { color: var(--ink); font-weight: 600; }
.langs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.langs button {
  font: 500 13px var(--mono); letter-spacing: .05em; color: var(--muted);
  background: none; border: 0; border-radius: 999px; padding: 6px 11px; cursor: pointer;
}
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.langs button:focus-visible, .btn:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }
h1 {
  font-family: var(--display); font-weight: 400; font-size: clamp(38px, 9vw, 56px);
  line-height: 1.02; letter-spacing: .01em; margin: 28px 0 10px; text-wrap: balance;
}
.lead { margin: 0; color: var(--muted); max-width: 58ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 18px 0 0; padding: 0; list-style: none; font-size: 14px; }
.facts li { display: flex; gap: 6px; }
.facts span { color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: 600 14px var(--body); text-decoration: none; border-radius: 8px;
  padding: 9px 14px; border: 1px solid var(--pine); min-height: 40px;
}
.btn.primary { background: var(--pine); color: var(--pine-ink); }
.btn.ghost { color: var(--pine); background: transparent; }
.btn svg { width: 16px; height: 16px; flex: none; }
.allroute { margin-top: 20px; }
h2 {
  font-family: var(--display); font-weight: 400; font-size: 28px; margin: 48px 0 6px;
}
.sub { margin: 0 0 20px; color: var(--muted); font-size: 15px; }

/* Tappe lungo la strada */
.road { list-style: none; margin: 0; padding: 0; position: relative; }
.road::before {
  content: ""; position: absolute; left: 39px; top: 8px; bottom: 8px; width: 2px;
  background: repeating-linear-gradient(var(--line) 0 10px, transparent 10px 16px);
}
.stop { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 14px; padding-block: 14px 22px; position: relative; }
.mile {
  justify-self: center; align-self: start; position: relative; z-index: 1;
  width: 64px; padding: 8px 4px 6px; text-align: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 26px 26px 4px 4px;
}
.mile small { display: block; font: 500 9px var(--mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.mile strong { display: block; font: 400 22px var(--display); color: var(--ochre); line-height: 1.1; }
.stop h3 { font-family: var(--display); font-weight: 400; font-size: 23px; line-height: 1.2; margin: 4px 0 6px; text-wrap: balance; }
.stop p { margin: 0 0 10px; max-width: 60ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.chip { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.chip.free { color: var(--pine); border-color: var(--pine); }
.tip { font-size: 14px; color: var(--muted); border-left: 2px solid var(--ochre); padding-left: 10px; margin: 0 0 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.routegroup { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.app { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.app button { font: 500 12px var(--body); color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 5px 9px; cursor: pointer; }
.app button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.app button:focus-visible { outline: 2px solid var(--pine); outline-offset: 1px; }
#allnote { margin: 8px 0 0; font-size: 13.5px; }

/* Dove mangiare */
.food { display: grid; gap: 0; border-top: 1px solid var(--line); }
.place { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: start; }
.place h3 { font-size: 17px; font-weight: 600; margin: 0; }
.kind { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ochre); }
.place p { margin: 2px 0 0; font-size: 14.5px; color: var(--muted); grid-column: 1 / -1; max-width: 60ch; }
.meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; margin-top: 6px; align-items: center; }
.meta .tel { font-family: var(--mono); font-size: 13px; user-select: all; }
.meta a { color: var(--pine); font-weight: 600; text-decoration: none; }
.place .addr { font-size: 13px; color: var(--muted); text-align: right; }

.hostbox {
  margin-top: 40px; padding: 18px 18px 16px; border-radius: 10px;
  background: var(--surface); border: 1px dashed var(--ochre);
}
.hostbox .kind { display: block; margin-bottom: 6px; }
.hostbox p { margin: 0; }
footer { margin-top: 36px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
@media (max-width: 420px) {
  .stop { grid-template-columns: 58px minmax(0, 1fr); gap: 10px; }
  .road::before { left: 28px; }
  .mile { width: 52px; }
  .mile strong { font-size: 19px; }
  .place { grid-template-columns: minmax(0, 1fr); }
  .place .addr { text-align: left; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn { transition: filter .15s; }
  .btn:hover { filter: brightness(1.08); }
}
</style>

const ICON_ROUTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>';
const ICON_BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>';

const walk = d => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(d) + "&travelmode=walking";
const search = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const wiki = (l, q) => "https://" + l + ".wikipedia.org/wiki/Special:Search?search=" + encodeURIComponent(q) + "&go=Go";
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* App per il percorso: Mappe su iPhone/iPad, Google Maps altrove; la scelta resta salvata */
let APP = (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) ? "apple" : "google";
try { const a = localStorage.getItem("appia-app"); if (a === "apple" || a === "google") APP = a; } catch (e) {}
const routeUrl = d => APP === "apple" ? "https://maps.apple.com/?daddr=" + encodeURIComponent(d) + "&dirflg=w" : walk(d);
const appPicker = u => `<span class="app" role="group" aria-label="${esc(u.appQ)}"><button type="button" data-app="google" aria-pressed="${APP === "google"}">${esc(u.appG)}</button><button type="button" data-app="apple" aria-pressed="${APP === "apple"}">${esc(u.appA)}</button></span>`;

function render(lang) {
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = u[el.dataset.t]; });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

  const last = STOPS[STOPS.length - 1].dest;
  const way = STOPS.slice(0, -1).map(s => s.dest).join("|");
  const all = document.getElementById("allroute");
  all.href = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(last) + "&waypoints=" + encodeURIComponent(way) + "&travelmode=walking";
  all.innerHTML = ICON_ROUTE + esc(u.all);
  const note = document.getElementById("allnote");
  note.textContent = u.note_apple;
  note.hidden = APP !== "apple";

  const chip = c => c.closed
    ? `<span class="chip">${esc(u.closed)} ${esc(DAYS[c.closed][lang])}</span>`
    : `<span class="chip${c.free ? " free" : ""}">${esc(c.t[lang])}</span>`;

  document.getElementById("road").innerHTML = STOPS.map(s => `
    <li class="stop">
      <div class="mile"><small>${esc(u.mile)}</small><strong>${s.mile}</strong></div>
      <div>
        <h3>${esc(s.name[lang])}</h3>
        <p>${esc(s.text[lang])}</p>
        <div class="chips">${s.chips.map(chip).join("")}</div>
        ${s.tip ? `<p class="tip">${esc(s.tip[lang])}</p>` : ""}
        <div class="actions">
          <span class="routegroup">
            <a class="btn primary" href="${routeUrl(s.dest)}" target="_blank" rel="noopener">${ICON_ROUTE}${esc(u.route)}</a>
            ${appPicker(u)}
          </span>
          <a class="btn ghost" href="${wiki(lang, s.wiki[lang])}" target="_blank" rel="noopener">${ICON_BOOK}${esc(u.more)}</a>
        </div>
      </div>
    </li>`).join("");

  document.getElementById("food").innerHTML = FOOD.map(f => `
    <div class="place">
      <div><span class="kind">${esc(u[f.kind])}</span><h3>${esc(f.name)}</h3></div>
      <div class="addr">${esc(f.addr)}</div>
      <p>${esc(f.t[lang])}</p>
      <div class="meta">
        <span>${f.closed ? esc(u.closed) + " " + esc(DAYS[f.closed][lang]) : esc(u.always)}</span>
        <span class="tel">${esc(f.tel)}</span>
        <a href="${search(f.name + ", " + f.addr + ", Roma")}" target="_blank" rel="noopener">${esc(u.map)} ↗</a>
      </div>
    </div>`).join("");

  try { localStorage.setItem("appia-lang", lang); } catch (e) {}
}

let start = "it";
try {
  const saved = localStorage.getItem("appia-lang");
  if (saved && UI[saved]) start = saved;
  else {
    const nav = (navigator.language || "it").slice(0, 2);
    if (UI[nav]) start = nav;
  }
} catch (e) {}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => render(b.dataset.lang)));
render(start);
document.getElementById("road").addEventListener("click", e => {
  const b = e.target.closest("[data-app]");
  if (!b) return;
  APP = b.dataset.app;
  try { localStorage.setItem("appia-app", APP); } catch (err) {}
  render(document.documentElement.lang || "it");
});

/* Modalità chiara / scura */
const MODE_LABEL = {
  it: ["Passa alla modalità scura", "Passa alla modalità chiara"],
  en: ["Switch to dark mode", "Switch to light mode"],
  fr: ["Passer en mode sombre", "Passer en mode clair"],
  de: ["Zum dunklen Modus wechseln", "Zum hellen Modus wechseln"]
};
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const modeBtn = document.getElementById("mode");
function setMode(m) {
  if (m === "dark") document.documentElement.setAttribute("data-mode", "dark");
  else document.documentElement.removeAttribute("data-mode");
  const dark = m === "dark";
  modeBtn.innerHTML = dark ? SUN : MOON;
  const lang = document.documentElement.lang || "it";
  modeBtn.setAttribute("aria-label", (MODE_LABEL[lang] || MODE_LABEL.it)[dark ? 1 : 0]);
  try { localStorage.setItem("appia-mode", m); } catch (e) {}
}
let mode = "light";
try { if (localStorage.getItem("appia-mode") === "dark") mode = "dark"; } catch (e) {}
setMode(mode);
modeBtn.addEventListener("click", () => {
  mode = mode === "dark" ? "light" : "dark";
  setMode(mode);
});
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setMode(mode)));

/* Il pulsante sparisce scorrendo in giù e torna scorrendo in su */
let lastY = window.scrollY;
let ticking = false;
window.addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const y = window.scrollY;
    if (y > lastY + 4 && y > 60) modeBtn.classList.add("away");
    else if (y < lastY - 4 || y <= 60) modeBtn.classList.remove("away");
    lastY = y;
    ticking = false;
  });
}, { passive: true });
</script>
