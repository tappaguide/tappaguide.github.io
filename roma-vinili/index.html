   LAYOUT: colonna stretta, schede itinerario, tappe lungo una linea. */

  --display:"Marcellus",Georgia,serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}

*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);overflow-x:clip}
.wrap{max-width:720px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left))}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.logo{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:400 20px var(--display)}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.seg button{font:600 15px var(--body);color:var(--muted);background:none;border:0;border-radius:999px;min-height:40px;padding:0 14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hero{margin:20px 0 0;border-radius:18px;overflow:hidden;aspect-ratio:16/9;background:var(--soft)}
.hero svg{display:block;width:100%;height:100%}
@media(prefers-reduced-motion:no-preference){.spin{transform-origin:330px 190px;animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}

.lead{margin:0;color:var(--muted);font-size:18px;max-width:56ch}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:28px 0 10px}
.tabs button{text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:76px;font:inherit}
.tabs small{font-size:13px;color:var(--muted)}
.tabs span{font-size:16px;font-weight:600;line-height:1.25}
.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.ihead{margin:26px 0 18px;padding:22px;border-radius:22px;border:2px solid var(--accent);background:var(--surface);display:grid;gap:10px}
.ihead h2{margin:0;font:400 34px/1.1 var(--display)}
.ihead p{margin:0;color:var(--muted);font-size:16px}
.info{margin:0 0 20px;padding:20px 22px;border-radius:18px;background:var(--soft);border:1px solid var(--line)}
.info dl{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:12px 18px}
.info dt{font-weight:600;font-size:15px}.info dd{margin:0;font-size:16px}
@media(max-width:480px){.info dl{grid-template-columns:minmax(0,1fr);gap:2px}.info dd{margin-bottom:10px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--accent);font:600 16px var(--body);text-decoration:none;color:var(--accent);background:transparent}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn svg{width:20px;height:20px;flex:none}
.all{display:flex;margin-bottom:8px}.all .btn{width:100%}
.line{list-style:none;margin:0;padding:0;position:relative}
.line::before{content:"";position:absolute;left:22px;top:24px;bottom:24px;width:3px;border-radius:2px;background:repeating-linear-gradient(var(--accent) 0 6px,transparent 6px 11px);opacity:.5}
.stop{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;padding-block:16px 22px}
.disc{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,var(--ochre) 0 9px,var(--vinyl) 9.5px 15px,#3a3d3b 15.5px 16px,var(--vinyl) 16.5px 20px,#3a3d3b 20.5px 21px,var(--vinyl) 21.5px);color:#fff;display:grid;place-items:center;font:600 13px var(--mono);position:relative;z-index:1}
.stop h3{font:400 26px/1.15 var(--display);margin:2px 0 6px}
.genre{font-size:14px;font-weight:600;color:var(--ochre);margin:0 0 6px}
.stop p{margin:0 0 10px;font-size:17px;max-width:60ch}
.addr{font-size:15px;color:var(--muted);margin-bottom:8px}
.hours{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px;margin-bottom:12px}
.st{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.st.on{background:var(--accent);color:var(--accent-ink)}.st.off{border:1px solid var(--muted);color:var(--muted)}.st.unk{border:1px dashed var(--ochre);color:var(--ochre)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .web{grid-column:1/-1}
.box{margin-top:28px;padding:22px;border-radius:20px;display:grid;gap:14px;background:var(--surface);border:1.5px solid var(--line)}
.box h3{margin:0;font:400 28px/1.15 var(--display)}
.box>p{margin:0;color:var(--muted);font-size:16px}
.card{background:var(--bg);border-radius:14px;padding:16px;display:grid;gap:6px;border:1px solid var(--line)}
.card .k{font-size:13px;color:var(--muted)}.card b{font-size:19px;line-height:1.25}.card p{margin:0;font-size:16px}
.card .btn{margin-top:6px;min-height:44px}
.sun{border-color:var(--ochre)}
.tip{margin-top:28px;padding:16px 18px;border-left:4px solid var(--ochre);background:var(--surface);font-size:16px}
.tip b{display:block;margin-bottom:4px}
footer{margin-top:28px;font-size:14px;color:var(--muted);display:grid;gap:6px}
footer b{color:var(--ink)}
@media(max-width:560px){.tabs{grid-template-columns:minmax(0,1fr)}.tabs button{min-height:60px}}
</style>
</head>

 {n:"Roundmidnight Dischi",a:"Via di Sant'Orsola 10, Roma",k:{it:"Oltre 25.000 titoli",en:"Over 25,000 titles"},t:{it:"Vinili, cd e cassette nuovi e usati, frutto di anni di ricerche in cantine e mercatini. Lun-sab 9-13 e 16-20.",en:"New and used vinyl, CDs and tapes gathered over years of digging. Mon-Sat 9-13 and 16-20."}},
 {n:"Elastic Rock",a:"Viale dei Quattro Venti 237, Roma",k:{it:"Monteverde",en:"Monteverde"},t:{it:"Negozio di quartiere a Monteverde, comodo dopo il giro di Trastevere.",en:"A neighbourhood shop in Monteverde, handy after the Trastevere walk."}}];

const enc=encodeURIComponent;
const gm=a=>"https://www.google.com/maps/dir/?api=1&destination="+enc(a)+"&travelmode=walking";
const am=a=>"https://maps.apple.com/?daddr="+enc(a)+"&dirflg=w";
const allR=t=>"https://www.google.com/maps/dir/?api=1&origin="+enc(t[0].a)+"&destination="+enc(t[t.length-1].a)+(t.length>2?"&waypoints="+enc(t.slice(1,-1).map(x=>x.a).join("|")):"")+"&travelmode=walking";

function romeNow(){
 try{const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Rome",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value;const d=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday"));
  return {d,m:(+g("hour")%24)*60+ +g("minute")};}catch(e){return null}}
const mins=s=>{const[h,m]=s.split(":");return +h*60+(+m||0)};
function isOpen(h){const n=romeNow();if(!n||!h)return null;const day=h[n.d];if(!day)return false;
 return day.split(",").some(r=>{const[a,b]=r.split("-");return n.m>=mins(a)&&n.m<mins(b)})}

let lang="it",cur=0;
try{const s=localStorage.getItem("tappa-lang");if(s&&T[s])lang=s}catch(e){}
try{const i=DATA.findIndex(x=>"#"+x.id===location.hash);if(i>=0)cur=i}catch(e){}

function render(){
 const L=T[lang];document.documentElement.lang=lang;
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=L[e.dataset.t]);
 document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
 document.getElementById("tabs").innerHTML=DATA.map((x,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===cur}"><small>${x.tappe.length} ${lang==="it"?"negozi":"shops"}</small><span>${x.nome[lang]}</span></button>`).join("");
 const it=DATA[cur];
 document.getElementById("iname").textContent=it.nome[lang];
 document.getElementById("isub").textContent=it.sotto[lang];
 document.getElementById("info").innerHTML=["dur","when","watch"].map(k=>`<dt>${L[k]}</dt><dd>${it.info[k][lang]}</dd>`).join("");
 const ar=document.getElementById("allroute");ar.href=allR(it.tappe);ar.innerHTML=ICO.walk+L.all;
 document.getElementById("stops").innerHTML=it.tappe.map((s,i)=>{
  const o=isOpen(s.h);const st=s.h==null?`<span class="st unk">${L.unk}</span>`:o===null?"":`<span class="st ${o?"on":"off"}">${o?L.open:L.closed}</span>`;
  return `<li class="stop"><div class="disc" aria-hidden="true">${String.fromCharCode(65)}${i+1}</div><div>
   <h3>${s.n}</h3><p class="genre">${s.g[lang]}</p><p>${s.t[lang]}</p>
   <div class="addr">${s.a.replace(", Roma","")}</div>
   <div class="hours">${st}${s.ht?`<span>${s.ht[lang]}</span>`:""}</div>
   <div class="acts"><a class="btn" href="${gm(s.a)}" target="_blank" rel="noopener">${ICO.pin}${L.gm}</a><a class="btn" href="${am(s.a)}" target="_blank" rel="noopener">${ICO.pin}${L.am}</a>${s.w?`<a class="btn web" href="${s.w}" target="_blank" rel="noopener">${ICO.web}${L.web}</a>`:""}</div>
  </div></li>`}).join("");
 const pp="Porta Portese, Roma";
 document.getElementById("sunday").innerHTML=`<h3>${L.sunT}</h3><p>${L.sunP}</p><div class="card"><span class="k">${lang==="it"?"Ogni domenica, dalle 7 alle 14 circa":"Every Sunday, roughly 7 am to 2 pm"}</span><b>Mercato di Porta Portese</b><p>${lang==="it"?"Bancarelle da Porta Portese fino a Piazza Ippolito Nievo: tra mobili e abiti spuntano cassette di vinili e cd, da sfogliare con pazienza. Andate presto e tenete d'occhio portafoglio e telefono. Tram 8, fermata Ippolito Nievo.":"Stalls from Porta Portese to Piazza Ippolito Nievo: among furniture and clothes there are crates of records and CDs to dig through. Go early and watch your wallet and phone. Tram 8, Ippolito Nievo stop."}</p><a class="btn" href="${gm(pp)}" target="_blank" rel="noopener">${ICO.pin}${L.gm}</a></div>`;
 document.getElementById("extra").innerHTML=`<h3>${L.exT}</h3><p>${L.exP}</p>`+EXTRA.map(e=>`<div class="card"><span class="k">${e.k[lang]}</span><b>${e.n}</b><p>${e.t[lang]}</p><p class="k">${e.a.replace(", Roma","")}</p><a class="btn" href="${gm(e.a)}" target="_blank" rel="noopener">${ICO.pin}${L.gm}</a></div>`).join("");
}

document.querySelector(".seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.lang;try{localStorage.setItem("tappa-lang",lang)}catch(x){}render()});
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cur=+b.dataset.i;try{history.replaceState(null,"","#"+DATA[cur].id)}catch(x){}render()});
window.addEventListener("hashchange",()=>{const i=DATA.findIndex(x=>"#"+x.id===location.hash);if(i>=0){cur=i;render()}});
setInterval(render,60000);
if("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("/sw.js").then(() => navigator.serviceWorker.ready).then(() => caches.open("tappa-1")).then(c => c.add(location.pathname)).catch(() => {});
render();
}
