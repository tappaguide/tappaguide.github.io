</style>

  const h = (location.hash || "").slice(1);
  HOST = HOSTS[h] ? h : (HOSTS[DEFAULT_HOST] ? DEFAULT_HOST : null);
  let st = document.getElementById("acc"); if (!st) { st = document.createElement("style"); st.id = "acc"; document.body.appendChild(st); }
  st.textContent = HOST ? `:root{--accent:${HOSTS[HOST].accent[0]}}` : "";
  NEAR = HOST ? DATA.findIndex(i => i.id === HOSTS[HOST].zone) : -1;
  if (NEAR >= 0) IT = NEAR;
}
const routeUrl = (d, o, app) => (app || APP) === "apple"
  ? "https://maps.apple.com/?" + (o ? "saddr=" + encodeURIComponent(o) + "&" : "") + "daddr=" + encodeURIComponent(d) + "&dirflg=w"
  : "https://www.google.com/maps/dir/?api=1" + (o ? "&origin=" + encodeURIComponent(o) : "") + "&destination=" + encodeURIComponent(d) + "&travelmode=walking";
const wiki = q => "https://" + LANG + ".wikipedia.org/wiki/Special:Search?search=" + encodeURIComponent(q) + "&go=Go";
const mapSearch = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);

const tabClass = (near, ico) => { const c = [near && "near", ico && "conic"].filter(Boolean).join(" "); return c ? ` class="${c}"` : ""; };
const tabIcona = ico => ico ? `<i class="tabic">${ico}</i>` : "";

function render() {
  const u = UI[LANG], I = DATA[IT];
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = u[el.dataset.t]);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  const trial = document.getElementById("trial"), from = document.getElementById("fromhost"), av = document.getElementById("avatar"), bn = document.getElementById("bname"), stay = document.getElementById("stay");
  if (HOST) {
    const H = HOSTS[HOST];
    trial.hidden = !!H.abbonata; trial.textContent = H.esempio ? u.demo : u.trial + " " + H.name;
    av.className = "avatar mono"; av.style.setProperty("--hc", H.accent[0]); av.setAttribute("aria-hidden", "true");
    if (H.foto) { av.className = "avatar foto"; av.innerHTML = `<img src="${H.foto}" alt="">`; } else av.textContent = H.ini;
    bn.textContent = H.name;
    stay.hidden = false;
    stay.innerHTML = (H.foto ? `<img class="cover" src="${H.foto}" alt="${esc(H.name)}">` : "") + `<div class="who">${H.foto ? "" : `<span class="avatar mono" style="--hc:${H.accent[0]}" aria-hidden="true">${esc(H.ini)}</span>`}<div><small>${esc(u.stay_k)}</small><h3>${esc(H.name)}</h3><p>${esc(H.addr)}</p></div></div>
      <div class="btns">
        <a class="btn p" href="${routeUrl(H.addr)}" target="_blank" rel="noopener">${ICON_ROUTE}${esc(u.back)}</a>
        ${H.booking ? `<a class="btn book" href="${H.booking}" target="_blank" rel="noopener">${ICON_BED}${esc(u.book)}</a>` : ""}
        ${H.wa ? `<a class="btn g" href="https://wa.me/${H.wa}" target="_blank" rel="noopener">${ICON_CHAT}${esc(u.write)}</a>` : ""}
        ${H.review ? `<a class="btn g" href="${H.review}" target="_blank" rel="noopener">${ICON_STAR}${esc(u.review)}</a>` : ""}
      </div>
      <p>${H.tel ? `${esc(u.call)}: <span style="user-select:all;color:var(--ink)">${esc(H.tel)}</span> · ` : ""}${esc(u.by)} <b style="color:var(--ink)">${esc(H.name)}</b></p>`;
    from.hidden = false; from.href = routeUrl(I.tappe[0].dest, H.addr); from.innerHTML = ICON_ROUTE + esc(u.from_host);
    document.getElementById("tiptext").textContent = u.tip;
  } else {
    trial.hidden = true; from.hidden = true; stay.hidden = true;
    av.className = "avatar"; av.innerHTML = LOGO; av.setAttribute("aria-hidden", "true"); bn.textContent = "Tappa · Roma";
    document.getElementById("tiptext").textContent = u.tip;
  }
  document.getElementById("tabs").innerHTML = DATA.map((d, i) =>
    `<button type="button" data-it="${i}" aria-pressed="${i === IT}"${tabClass(i === NEAR, d.icona)}>${tabIcona(d.icona)}${i === NEAR ? `<em class="nb">${ICON_MAP}${esc(u.near)}</em>` : ""}<small>${esc(u.it_k)} ${i + 1}</small><span>${esc(d.nome[LANG])}</span></button>`).join("");
  document.getElementById("tabs").insertAdjacentHTML("beforeend", BLOCCATI.map(b => `<button type="button" disabled${tabClass(false, b.icona)}>${tabIcona(b.icona)}<small>${esc(u.locked)}</small><span>${esc(b.nome[LANG])}</span></button>`).join(""));
  const ln = document.getElementById("lockednote"); ln.hidden = !BLOCCATI.length; ln.textContent = u.locked_note;
  const nl = document.getElementById("nearline"); nl.hidden = IT !== NEAR; nl.innerHTML = ICON_MAP + esc(u.nearline);
  document.getElementById("hero").innerHTML = ILL[IT] + `<figcaption>${esc(ILL_NOME[IT])}</figcaption>`;
  document.getElementById("iname").textContent = I.nome[LANG];
  const tp = I.tappe, ultima = [...tp].reverse().find(t => !t.locale);
  document.getElementById("facts").innerHTML =
    `<span class="fact km">${ICON_WALK}<b>≈ ${I.km} km</b></span>` +
    `<span class="fact route"><span class="pt"><small>${esc(u.start)}</small>${esc(HOST && HOSTS[HOST].startHere ? HOSTS[HOST].name : tp[0].nome[LANG])}</span><span class="arr" aria-hidden="true">→</span><span class="pt"><small>${esc(u.end)}</small>${esc(ultima.nome[LANG])}</span></span>` +
    (I.nota[LANG] ? `<span class="fact warn">${ICON_ALERT}${esc(I.nota[LANG])}</span>` : "");
  const L = INFOL[LANG], sosta = I.tappe.find(t => t.locale);
  const righe = [[L.durata, I.info.durata[LANG]], [L.tappe, I.tappe.length + (sosta ? " · " + L.sosta + ": " + sosta.nome[LANG] : "")],
                 [L.biglietti, I.info.biglietti[LANG]], [L.quando, I.info.quando[LANG]], [L.attenzione, I.info.attenzione[LANG]]];
  if (I.info.accesso) righe.push([L.accesso, I.info.accesso[LANG]]);
  if (I.info.bagni) righe.push([L.bagni, I.info.bagni[LANG]]);
  document.getElementById("info").innerHTML = `<h3>${esc(L.box)}</h3><dl>${righe.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
  const d = I.tappe.map(t => t.dest), all = document.getElementById("allroute");
  const da = HOST && HOSTS[HOST].startHere ? HOSTS[HOST].addr : d[0], tappeV = HOST && HOSTS[HOST].startHere ? d.slice(0, -1) : d.slice(1, -1);
  all.href = "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(da) + "&destination=" + encodeURIComponent(d[d.length - 1]) + "&waypoints=" + encodeURIComponent(tappeV.join("|")) + "&travelmode=walking";
  all.innerHTML = ICON_ROUTE + esc(u.all);
  document.getElementById("allnote").innerHTML = `<span class="cico">${ICON_INFO}</span><div><b>${esc(u.allk)}</b><span>${esc(u.allnote)}</span></div>`;
  const vie = d => `<div class="via"><small>${esc(u.appk)}</small><div class="due">${["google", "apple"].map(a =>
      `<a class="btn ${APP === a ? "p" : "g"}" data-app="${a}" href="${routeUrl(d, null, a)}" target="_blank" rel="noopener">${esc(a === "google" ? u.gs : u.as)}</a>`).join("")}</div></div>`;
  document.getElementById("stops").innerHTML = I.tappe.map((t, i) => `
    <li class="stop${t.locale ? " food" : ""}">
      <div class="dot">${i + 1}</div>
      <div>
        ${t.locale ? `<span class="tag">${esc(t.sponsor ? u.partner : u.food)}</span>` : ""}
        <div class="th"><span class="ico">${ICONE[t.ico]}</span><h3>${esc(t.nome[LANG])}</h3></div>
        <p>${esc(t.testo[LANG])}</p>
        ${t.chiuso ? `<div class="chips"><span class="chip">${esc(u.closed)} ${esc(DOW[t.chiuso][LANG])}</span></div>` : ""}
        <div class="actions">
          ${vie(t.dest)}
          ${t.uff ? `<a class="btn t" href="${t.uff[1]}" target="_blank" rel="noopener">${ICON_TICKET}${esc(t.uff[0] === "b" ? u.tickets : u.official)}</a>` : ""}
          ${t.wiki ? `<a class="btn g" href="${wiki(t.wiki[LANG])}" target="_blank" rel="noopener">${ICON_BOOK}${esc(u.more)}</a>`
                   : `<a class="btn g" href="${mapSearch(t.dest)}" target="_blank" rel="noopener">${ICON_MAP}${esc(u.more)}</a>`}
        </div>
      </div>
    </li>`).join("");
  const rain = document.getElementById("rain"), eat = document.getElementById("eat");
  const scheda = (x, kind) => `<div class="card">${x.tipo ? `<span class="k">${esc(x.tipo[LANG])}</span>` : ""}<b>${esc(x.nome)}</b><p>${esc(x.testo[LANG])}</p>
      ${x.chiuso ? `<div class="chips"><span class="chip">${esc(u.closed)} ${esc(DOW[x.chiuso][LANG])}</span></div>` : ""}
      <div class="row"><a class="btn p" href="${routeUrl(x.dest)}" target="_blank" rel="noopener">${ICON_ROUTE}${esc(u.route)}</a>
      ${x.sito ? `<a class="btn g" href="${x.sito}" target="_blank" rel="noopener">${ICON_BOOK}${esc(u.official)}</a>` : `<a class="btn g" href="${mapSearch(x.dest)}" target="_blank" rel="noopener">${ICON_MAP}${esc(u.more)}</a>`}</div></div>`;
  rain.hidden = !I.pioggia; eat.hidden = !I.fine;
  if (I.pioggia) rain.innerHTML = `<h3><span class="ico">${ICONE.pioggia}</span>${esc(u.rain_k)}</h3><p>${esc(u.rain_sub)}</p>` + I.pioggia.map(x => scheda(x)).join("");
  if (I.fine) eat.innerHTML = `<h3><span class="ico">${ICONE.cibo}</span>${esc(u.eat_k)}</h3><p>${esc(u.eat_sub)}</p>` + I.fine.map(x => scheda(x)).join("");
  const picks = document.getElementById("picks"), miei = (HOST && HOSTS[HOST].consigli) || [];
  picks.hidden = !miei.length;
  if (miei.length) picks.innerHTML = `<h3><span class="ico">${ICONE.cibo}</span>${esc(u.picks_k)} ${esc(HOSTS[HOST].name)}</h3><p>${esc(u.picks_sub)}</p>` + miei.map(x => scheda(x)).join("");
  const ios = /iPhone|iPad|Macintosh/.test(navigator.userAgent);
  const q = encodeURIComponent(WATER.q);
  const vicino = APP === "apple" ? "https://maps.apple.com/?q=" + q : "https://www.google.com/maps/search/?api=1&query=" + q;
  document.getElementById("water").innerHTML = `<a class="btn w" href="${vicino}" target="_blank" rel="noopener">${ICON_DROP}${esc(WATER.near[LANG])}</a>` +
    (WATER.app ? `<a class="btn g" href="${ios ? WATER.app.ios : WATER.app.android}" target="_blank" rel="noopener">${ICON_MAP}${esc(WATER.app.label[LANG])}</a>` : "");
  document.title = HOST ? "Roma a piedi · " + HOSTS[HOST].name : "Tappa Roma";
  setModeLabel();
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { LANG = b.dataset.lang; store.set("tr-lang", LANG); render(); }));
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-it]"); if (!b) return; IT = +b.dataset.it; render(); document.getElementById("iname").scrollIntoView({ behavior: "smooth", block: "start" }); });
document.getElementById("stops").addEventListener("click", e => { const b = e.target.closest("[data-app]"); if (!b) return; APP = b.dataset.app; store.set("tr-app", APP); setTimeout(render, 300); });
window.addEventListener("hashchange", () => { pickHost(); render(); });

const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const modeBtn = document.getElementById("mode");
let MODE = store.get("tr-mode") === "dark" ? "dark" : "light";
function setModeLabel() { const L = { it: ["Modalità scura", "Modalità chiara"], en: ["Dark mode", "Light mode"], fr: ["Mode sombre", "Mode clair"], de: ["Dunkler Modus", "Heller Modus"] }[LANG]; modeBtn.setAttribute("aria-label", L[MODE === "dark" ? 1 : 0]); }
function applyMode() { if (MODE === "dark") document.documentElement.setAttribute("data-mode", "dark"); else document.documentElement.removeAttribute("data-mode"); modeBtn.innerHTML = MODE === "dark" ? SUN : MOON; setModeLabel(); store.set("tr-mode", MODE); }
modeBtn.addEventListener("click", () => { MODE = MODE === "dark" ? "light" : "dark"; applyMode(); });
let lastY = window.scrollY, tick = false;
window.addEventListener("scroll", () => { if (tick) return; tick = true; requestAnimationFrame(() => { const y = window.scrollY;
  if (y > lastY + 4 && y > 60) modeBtn.classList.add("away"); else if (y < lastY - 4 || y <= 60) modeBtn.classList.remove("away"); lastY = y; tick = false; }); }, { passive: true });

pickHost();
const itq = DATA.findIndex(i => i.id === new URLSearchParams(location.search).get("it"));   // ?it=monti apre quell'itinerario
if (itq >= 0) IT = itq;
applyMode(); render();
</script>

<script>if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("/sw.js").then(() => navigator.serviceWorker.ready).then(() => caches.open("tappa-1")).then(c => c.add(location.pathname)).catch(() => {});</script>
