<style>
/* Layout: una colonna stretta; i giorni sono schede, le tappe scorrono lungo la linea come le fermate del métro. */
:root {
  --bg: #FFFFFF; --surface: #F4F5F7; --ink: #1D2127; --muted: #59606B; --line: #D5D9E0;

  color-scheme: light;
}
:root[data-mode="dark"] {
  --bg: #121519; --surface: #1B1F25; --ink: #E6E9EE; --muted: #9AA2AE; --line: #303640;
  --accent: #9DB8DA; --accent-ink: #0E1622; --gold: #D9B86A; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
.wrap { max-width: 700px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 60px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-right: 54px; }
.brand { font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.seg { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.seg button { font: 500 13px var(--mono); color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 6px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 10vw, 60px); line-height: 1; margin: 26px 0 10px; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 58ch; }
.days { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 26px 0 8px; }
.days a { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); background: var(--surface); }
.days a small { font: 500 11px var(--mono); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.days a span { font-size: 13.5px; line-height: 1.3; }
.days a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.days a[aria-current="page"] small { color: var(--accent-ink); opacity: .8; }
h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 30px 0 4px; }
.sub { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); font: 600 14px var(--body); text-decoration: none; }
.btn.p { background: var(--accent); color: var(--accent-ink); }
.btn.g { color: var(--accent); }
.btn svg { width: 16px; height: 16px; }
.line { list-style: none; margin: 0; padding: 0; position: relative; }
.line::before { content: ""; position: absolute; left: 19px; top: 12px; bottom: 12px; width: 4px; border-radius: 2px; background: var(--accent); opacity: .25; }
.stop { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 14px; padding-block: 14px 20px; position: relative; }
.dot { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 4px solid var(--accent); font: 600 15px var(--mono); color: var(--accent); position: relative; z-index: 1; }
.stop h3 { font-family: var(--display); font-weight: 400; font-size: 23px; line-height: 1.2; margin: 6px 0 6px; }
.stop p { margin: 0 0 10px; max-width: 60ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.chip.warn { color: var(--gold); border-color: var(--gold); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { margin-top: 30px; padding: 14px 16px; border-left: 3px solid var(--gold); background: var(--surface); font-size: 14.5px; color: var(--muted); }
footer { margin-top: 30px; font-size: 13px; color: var(--muted); }
.mode { position: fixed; z-index: 20; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.mode svg { width: 20px; height: 20px; }
.mode.away { transform: translateY(calc(-100% - 24px - env(safe-area-inset-top, 0px))); opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .mode { transition: transform .25s, opacity .25s; } }
@media (max-width: 520px) { .days { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>

      ["Le Bateau-Lavoir, Paris", { it: "Bateau-Lavoir", en: "Bateau-Lavoir", fr: "Bateau-Lavoir" }, { it: "Bateau-Lavoir", en: "Bateau-Lavoir", fr: "Bateau-Lavoir" },
        { it: "Qui Picasso dipinse Les Demoiselles d'Avignon. Oggi si vede solo la facciata sulla piazzetta.", en: "Where Picasso painted Les Demoiselles d'Avignon. Today you see only the façade on the little square.", fr: "Là où Picasso peignit Les Demoiselles d'Avignon. On voit aujourd'hui la façade sur la placette." }],
      ["Place du Tertre, Paris", { it: "Place du Tertre", en: "Place du Tertre", fr: "Place du Tertre" }, { it: "Place du Tertre", en: "Place du Tertre", fr: "Place du Tertre" },
        { it: "La piazza dei pittori di strada, nel cuore del villaggio di Montmartre.", en: "The square of street painters, in the heart of Montmartre village.", fr: "La place des peintres, au cœur du village de Montmartre." }],
      ["Basilique du Sacré-Cœur de Montmartre, Paris", { it: "Sacré-Cœur", en: "Sacré-Cœur", fr: "Sacré-Cœur" }, { it: "Basilica del Sacro Cuore (Parigi)", en: "Sacré-Cœur, Paris", fr: "Basilique du Sacré-Cœur de Montmartre" },
        { it: "La basilica bianca in cima alla collina: dalla scalinata il tramonto su tutta Parigi.", en: "The white basilica on top of the hill: watch the sunset over Paris from its steps.", fr: "La basilique blanche au sommet de la butte : coucher de soleil sur Paris depuis les marches." }]
    ] }
];

const ICON_ROUTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>';
const ICON_BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

let LANG = store.get("paris-lang") || ((navigator.language || "it").slice(0, 2));
if (!UI[LANG]) LANG = "it";
let APP = store.get("paris-app") || ((/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) ? "apple" : "google");
const dayFromHash = () => { const m = /^#giorno-([1-4])$/.exec(location.hash); return m ? +m[1] - 1 : 0; };
let DAY = dayFromHash();

const routeUrl = d => APP === "apple"
  ? "https://maps.apple.com/?daddr=" + encodeURIComponent(d) + "&dirflg=w"
  : "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(d) + "&travelmode=walking";
const wiki = (q) => "https://" + LANG + ".wikipedia.org/wiki/Special:Search?search=" + encodeURIComponent(q) + "&go=Go";

function render() {
  const u = UI[LANG];
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = u[el.dataset.t]);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  document.getElementById("days").innerHTML = DAYS.map((d, i) =>
    `<a href="#giorno-${i + 1}"${i === DAY ? ' aria-current="page"' : ""}><small>${esc(u.day)} ${i + 1}</small><span>${esc(d.name[LANG])}</span></a>`).join("");
  const d = DAYS[DAY];
  document.getElementById("dayname").textContent = `${u.day} ${DAY + 1} · ${d.name[LANG]}`;
  document.getElementById("daysub").textContent = d.sub[LANG];
  const dests = d.stops.map(s => s[0]);
  const all = document.getElementById("allday");
  all.href = "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(dests[0]) + "&destination=" + encodeURIComponent(dests[dests.length - 1]) +
    "&waypoints=" + encodeURIComponent(dests.slice(1, -1).join("|")) + "&travelmode=walking";
  all.innerHTML = ICON_ROUTE + esc(u.all);
  document.getElementById("appsel").innerHTML = ["google", "apple"].map(a =>
    `<button type="button" data-app="${a}" aria-pressed="${APP === a}">${esc(a === "google" ? u.g : u.a)}</button>`).join("");
  document.getElementById("stops").innerHTML = d.stops.map((s, i) => `
    <li class="stop">
      <div class="dot">${i + 1}</div>
      <div>
        <h3>${esc(s[1][LANG])}</h3>
        <p>${esc(s[3][LANG])}</p>
        ${s[4] ? `<div class="chips"><span class="chip warn">${esc(u.closed)} ${esc(DOW[s[4]][LANG])}</span></div>` : ""}
        <div class="actions">
          <a class="btn p" href="${routeUrl(s[0])}" target="_blank" rel="noopener">${ICON_ROUTE}${esc(u.route)}</a>
          <a class="btn g" href="${wiki(s[2][LANG])}" target="_blank" rel="noopener">${ICON_BOOK}${esc(u.more)}</a>
        </div>
      </div>
    </li>`).join("");
  document.title = u.title;
  setModeLabel();
}

document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { LANG = b.dataset.lang; store.set("paris-lang", LANG); render(); }));
document.getElementById("appsel").addEventListener("click", e => { const b = e.target.closest("[data-app]"); if (!b) return; APP = b.dataset.app; store.set("paris-app", APP); render(); });
window.addEventListener("hashchange", () => { DAY = dayFromHash(); render(); window.scrollTo({ top: document.getElementById("days").offsetTop - 10 }); });

const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const modeBtn = document.getElementById("mode");
let MODE = store.get("paris-mode") === "dark" ? "dark" : "light";
function setModeLabel() {
  const L = { it: ["Modalità scura", "Modalità chiara"], en: ["Dark mode", "Light mode"], fr: ["Mode sombre", "Mode clair"] }[LANG];
  modeBtn.setAttribute("aria-label", L[MODE === "dark" ? 1 : 0]);
}
function applyMode() {
  if (MODE === "dark") document.documentElement.setAttribute("data-mode", "dark"); else document.documentElement.removeAttribute("data-mode");
  modeBtn.innerHTML = MODE === "dark" ? SUN : MOON; setModeLabel(); store.set("paris-mode", MODE);
}
modeBtn.addEventListener("click", () => { MODE = MODE === "dark" ? "light" : "dark"; applyMode(); });
let lastY = window.scrollY, tick = false;
window.addEventListener("scroll", () => {
  if (tick) return; tick = true;
  requestAnimationFrame(() => { const y = window.scrollY;
    if (y > lastY + 4 && y > 60) modeBtn.classList.add("away"); else if (y < lastY - 4 || y <= 60) modeBtn.classList.remove("away");
    lastY = y; tick = false; });
}, { passive: true });

applyMode();
render();
</script>

</body>
</html>
