<style>
/* Layout: colonna stretta; gli itinerari sono schede grandi, le tappe scorrono lungo una linea come le miglia di una strada romana. */
:root {
  --bg: #FFFFFF; --surface: #F4F5F1; --ink: #1E2225; --muted: #545C58; --line: #D3D7CF;
  --accent: #2D5843; --accent-ink: #F2F6F1; --ochre: #8F6219; --soft: #E3ECE6;
  --display: "Marcellus", Georgia, serif; --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
:root[data-mode="dark"] { --bg: #121514; --surface: #1B1F1D; --ink: #E6E8E3; --muted: #A3ABA6; --line: #323835; --accent: #82B898; --accent-ink: #0E1913; --ochre: #D7AC62; --soft: #22302A; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--body); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 64px; }
.trial { font: 500 13px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ochre); border: 1px dashed var(--ochre); border-radius: 8px; padding: 10px 14px; margin-right: 56px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; padding-right: 58px; }
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; flex: 1 1 0; min-width: 0; color: var(--ink); }
.avatar { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; flex: none; background: #ECEDE8; border: 2px solid var(--line); }
.avatar svg { width: 72%; height: 72%; }
.avatar.mono { background: var(--hc, var(--accent)); border-color: var(--hc, var(--accent)); color: #fff; font: 400 25px var(--display); letter-spacing: .02em; }
.bname { font-size: 14px; font-weight: 600; line-height: 1.25; max-width: 18ch; }
.stay { margin-top: 30px; padding: 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); display: grid; gap: 16px; }
.stay .who { display: flex; gap: 14px; align-items: center; }
.stay .who > div { min-width: 0; }
.stay small { display: block; font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stay h3 { margin: 2px 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.1; }
.stay p { margin: 0; color: var(--muted); font-size: 16px; }
.stay .btns { display: grid; gap: 10px; }
.stay .btns .btn { width: 100%; justify-content: center; }
.btn.book { background: #003B95; border-color: #003B95; color: #fff; } .host b { color: var(--ink); }
.seg { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.seg button { font: 600 15px var(--body); color: var(--muted); background: none; border: 0; border-radius: 999px; min-height: 40px; padding: 0 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(42px, 11vw, 64px); line-height: 1; margin: 24px 0 10px; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); font-size: 18px; max-width: 56ch; }
.trial:not([hidden]) + .top { padding-right: 0; }
.hero { position: relative; margin: 20px 0 0; border-radius: 18px; overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; background: var(--surface); }
.hero svg { display: block; width: 100%; height: 100%; }
:root[data-mode="dark"] .hero svg { filter: brightness(.88); }
.hero figcaption { position: absolute; left: 12px; bottom: 12px; font: 600 15px var(--body); color: #1E2225; background: rgba(255,255,255,.88); border-radius: 999px; padding: 6px 14px; }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 28px 0 10px; }
.tabs button { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 76px; font: inherit; }
.tabs small { font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tabs span { font-size: 16px; font-weight: 600; line-height: 1.25; }
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tabs button[aria-pressed="true"] small { color: var(--accent-ink); opacity: .85; }
h2 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.1; margin: 30px 0 6px; }
.sub { margin: 0 0 18px; color: var(--muted); font-size: 16px; }
.info { margin: 0 0 20px; padding: 20px 22px; border-radius: 18px; background: var(--soft); border: 1px solid var(--line); }
.info h3 { margin: 0 0 12px; font: 500 13px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.info dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 12px 18px; }
.info dt { font-weight: 600; font-size: 15px; color: var(--ink); padding-top: 1px; }
.info dd { margin: 0; font-size: 16px; line-height: 1.5; color: var(--ink); }
@media (max-width: 480px) { .info dl { grid-template-columns: minmax(0, 1fr); gap: 2px; } .info dd { margin-bottom: 10px; } .info dd:last-child { margin-bottom: 0; } }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.tabs button.near { border: 2px solid var(--ochre); }
.nb { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; font: normal 600 12px/1 var(--body); background: var(--ochre); color: #fff; border-radius: 999px; padding: 5px 9px 5px 7px; margin-bottom: 4px; }
.nb svg { width: 13px; height: 13px; }
.ihead { margin: 30px 0 18px; padding: 22px; border-radius: 22px; border: 2px solid var(--accent); background: var(--surface); display: grid; gap: 14px; }
.ihead h2 { margin: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: 15px; color: var(--ink); }
.fact svg { width: 18px; height: 18px; flex: none; color: var(--accent); }
.fact.km b { font-size: 17px; }
.fact.route { order: 3; border-radius: 16px; flex: 1 1 100%; min-width: 0; gap: 10px; }
.fact .pt { display: flex; flex-direction: column; flex: 1 1 0; font-weight: 600; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
.fact .pt small { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fact .arr { color: var(--accent); font-size: 20px; }
.fact.warn { color: var(--ochre); border-color: var(--ochre); }
.fact.warn svg { color: var(--ochre); }
.nearline { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-weight: 600; font-size: 15px; color: var(--ochre); }
.nearline svg { width: 18px; height: 18px; flex: none; }
.callout { flex-basis: 100%; display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: 18px; border: 1.5px solid var(--ochre); background: var(--surface); }
.callout .cico { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--ochre); color: #fff; display: grid; place-items: center; }
.callout .cico svg { width: 20px; height: 20px; }
.callout b { display: block; font-size: 17px; line-height: 1.3; color: var(--ink); margin-bottom: 4px; }
.callout span { font-size: 16px; line-height: 1.5; color: var(--muted); }
.th { display: flex; align-items: center; gap: 12px; margin: 2px 0 8px; }
.th h3 { margin: 0; }
.ico { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--soft); color: var(--accent); display: grid; place-items: center; }
.ico svg { width: 30px; height: 30px; }
.via { flex-basis: 100%; display: grid; gap: 6px; }
.via small { font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.via .due { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.via .btn { padding: 0 8px; font-size: 16px; min-width: 0; }
.rowp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex-basis: 100%; }
.rowp .btn { flex: 1 1 120px; min-width: 0; padding: 0 12px; }
.rowp .seg { flex: none; }
.rowp .seg button { min-height: 42px; padding: 0 9px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 12px; border: 2px solid var(--accent); font: 600 17px var(--body); text-decoration: none; }
.btn.p { background: var(--accent); color: var(--accent-ink); } .btn.g { color: var(--accent); background: transparent; }
.btn.t { flex-basis: 100%; color: var(--ochre); border-color: var(--ochre); background: transparent; }
.btn svg { width: 20px; height: 20px; flex: none; }
.line { list-style: none; margin: 0; padding: 0; position: relative; }
.line::before { content: ""; position: absolute; left: 21px; top: 14px; bottom: 14px; width: 4px; border-radius: 2px; background: var(--accent); opacity: .22; }
.stop { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 14px; padding-block: 16px 22px; }
.dot { width: 46px; height: 50px; border-radius: 23px 23px 6px 6px; display: grid; place-items: center; background: var(--bg); border: 3px solid var(--accent); font: 600 18px var(--mono); color: var(--accent); position: relative; z-index: 1; }
.stop.food .dot { background: var(--ochre); border-color: var(--ochre); color: #fff; }
.stop h3 { font-family: var(--display); font-weight: 400; font-size: 27px; line-height: 1.15; margin: 4px 0 8px; }
.stop p { margin: 0 0 12px; font-size: 17px; max-width: 60ch; }
.tag { display: inline-block; font: 600 13px var(--body); letter-spacing: .04em; text-transform: uppercase; color: var(--ochre); margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { font-size: 14px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--ochre); color: var(--ochre); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.tip { margin-top: 30px; padding: 16px 18px; border-left: 4px solid var(--ochre); background: var(--surface); font-size: 16px; }
.tip b { display: block; margin-bottom: 4px; }
footer { margin-top: 26px; font-size: 14px; color: var(--muted); }
.mode { position: fixed; z-index: 20; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.mode svg { width: 22px; height: 22px; }
.mode.away { transform: translateY(calc(-100% - 24px - env(safe-area-inset-top, 0px))); opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .mode { transition: transform .25s, opacity .25s; } }
@media (max-width: 560px) { .seg button { padding: 0 10px; } .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .btn { flex: 1 1 auto; } }
</style>
</head>

<button type="button" class="mode" id="mode"></button>
<div class="wrap">
  <div class="trial" id="trial" hidden></div>

    <div class="brand" id="brand"><span class="avatar" id="avatar"></span><span class="bname" id="bname"></span></div>

    </div>

  <figure class="hero" id="hero"></figure>
  <h1 data-t="title"></h1>

  <div class="ihead">

  <section class="stay" id="stay" hidden></section>
  <footer data-t="foot"></footer>
</div>

        <a class="btn g" href="${H.review}" target="_blank" rel="noopener">${ICON_STAR}${esc(u.review)}</a>
      </div>
      <p>${esc(u.call)}: <span style="user-select:all;color:var(--ink)">${esc(H.tel)}</span> · ${esc(u.by)} <b style="color:var(--ink)">${esc(H.name)}</b></p>`;
    from.hidden = false; from.href = routeUrl(I.tappe[0].dest, H.addr); from.innerHTML = ICON_ROUTE + esc(u.from_host);
    document.getElementById("tiptext").textContent = u.tip_host;
  } else {
    trial.hidden = true; from.hidden = true; stay.hidden = true;
    av.className = "avatar"; av.innerHTML = LOGO; av.setAttribute("aria-hidden", "true"); bn.textContent = "Tappa · Roma";
    document.getElementById("tiptext").textContent = u.tip;
  }
  document.getElementById("tabs").innerHTML = DATA.map((d, i) =>
    `<button type="button" data-it="${i}" aria-pressed="${i === IT}"${i === NEAR ? ' class="near"' : ""}>${i === NEAR ? `<em class="nb">${ICON_MAP}${esc(u.near)}</em>` : ""}<small>${esc(u.it_k)} ${i + 1}</small><span>${esc(d.nome[LANG])}</span></button>`).join("");
  const nl = document.getElementById("nearline"); nl.hidden = IT !== NEAR; nl.innerHTML = ICON_MAP + esc(u.nearline);
  document.getElementById("hero").innerHTML = ILL[IT] + `<figcaption>${esc(ILL_NOME[IT])}</figcaption>`;
  document.getElementById("iname").textContent = I.nome[LANG];
  const tp = I.tappe, ultima = [...tp].reverse().find(t => !t.locale);
  document.getElementById("facts").innerHTML =
    `<span class="fact km">${ICON_WALK}<b>≈ ${I.km} km</b></span>` +
    `<span class="fact route"><span class="pt"><small>${esc(u.start)}</small>${esc(tp[0].nome[LANG])}</span><span class="arr" aria-hidden="true">→</span><span class="pt"><small>${esc(u.end)}</small>${esc(ultima.nome[LANG])}</span></span>` +
    (I.nota[LANG] ? `<span class="fact warn">${ICON_ALERT}${esc(I.nota[LANG])}</span>` : "");
  const L = INFOL[LANG], sosta = I.tappe.find(t => t.locale);
  const righe = [[L.durata, I.info.durata[LANG]], [L.tappe, I.tappe.length + (sosta ? " · " + L.sosta + ": " + sosta.nome[LANG] : "")],
                 [L.biglietti, I.info.biglietti[LANG]], [L.quando, I.info.quando[LANG]], [L.attenzione, I.info.attenzione[LANG]]];
  document.getElementById("info").innerHTML = `<h3>${esc(L.box)}</h3><dl>${righe.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
  const d = I.tappe.map(t => t.dest), all = document.getElementById("allroute");
  all.href = "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(d[0]) + "&destination=" + encodeURIComponent(d[d.length - 1]) + "&waypoints=" + encodeURIComponent(d.slice(1, -1).join("|")) + "&travelmode=walking";
  all.innerHTML = ICON_ROUTE + esc(u.all);
  document.getElementById("allnote").innerHTML = `<span class="cico">${ICON_INFO}</span><div><b>${esc(u.allk)}</b><span>${esc(u.allnote)}</span></div>`;
  const vie = d => `<div class="via"><small>${esc(u.appk)}</small><div class="due">${["google", "apple"].map(a =>
      `<a class="btn ${APP === a ? "p" : "g"}" data-app="${a}" href="${routeUrl(d, null, a)}" target="_blank" rel="noopener">${esc(a === "google" ? u.gs : u.as)}</a>`).join("")}</div></div>`;
  document.getElementById("stops").innerHTML = I.tappe.map((t, i) => `
    <li class="stop${t.locale ? " food" : ""}">
      <div class="dot">${i + 1}</div>
      <div>
        ${t.locale ? `<span class="tag">${esc(u.food)}</span>` : ""}
        <div class="th"><span class="ico">${ICONE[t.ico]}</span><h3>${esc(t.nome[LANG])}</h3></div>
        <p>${esc(t.testo[LANG])}</p>
        ${t.chiuso ? `<div class="chips"><span class="chip">${esc(u.closed)} ${esc(DOW[t.chiuso][LANG])}</span></div>` : ""}
        <div class="actions">
          ${vie(t.dest)}
          ${t.uff ? `<a class="btn t" href="${t.uff[1]}" target="_blank" rel="noopener">${ICON_TICKET}${esc(t.uff[0] === "b" ? u.tickets : u.official)}</a>` : ""}
          ${t.wiki ? `<a class="btn g" href="${wiki(t.wiki[LANG])}" target="_blank" rel="noopener">${ICON_BOOK}${esc(u.more)}</a>`
                   : `<a class="btn g" href="${mapSearch(t.dest)}" target="_blank" rel="noopener">${ICON_MAP}${esc(u.more)}</a>`}
        </div>
      </div>
    </li>`).join("");
  document.title = HOST ? "Roma a piedi · " + HOSTS[HOST].name : "Tappa Roma";
  setModeLabel();
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { LANG = b.dataset.lang; store.set("tr-lang", LANG); render(); }));
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-it]"); if (!b) return; IT = +b.dataset.it; render(); document.getElementById("iname").scrollIntoView({ behavior: "smooth", block: "start" }); });
document.getElementById("stops").addEventListener("click", e => { const b = e.target.closest("[data-app]"); if (!b) return; APP = b.dataset.app; store.set("tr-app", APP); setTimeout(render, 300); });
window.addEventListener("hashchange", () => { pickHost(); render(); });

const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const modeBtn = document.getElementById("mode");
let MODE = store.get("tr-mode") === "dark" ? "dark" : "light";
function setModeLabel() { const L = { it: ["Modalità scura", "Modalità chiara"], en: ["Dark mode", "Light mode"], fr: ["Mode sombre", "Mode clair"], de: ["Dunkler Modus", "Heller Modus"] }[LANG]; modeBtn.setAttribute("aria-label", L[MODE === "dark" ? 1 : 0]); }
function applyMode() { if (MODE === "dark") document.documentElement.setAttribute("data-mode", "dark"); else document.documentElement.removeAttribute("data-mode"); modeBtn.innerHTML = MODE === "dark" ? SUN : MOON; setModeLabel(); store.set("tr-mode", MODE); }
modeBtn.addEventListener("click", () => { MODE = MODE === "dark" ? "light" : "dark"; applyMode(); });
let lastY = window.scrollY, tick = false;
window.addEventListener("scroll", () => { if (tick) return; tick = true; requestAnimationFrame(() => { const y = window.scrollY;
  if (y > lastY + 4 && y > 60) modeBtn.classList.add("away"); else if (y < lastY - 4 || y <= 60) modeBtn.classList.remove("away"); lastY = y; tick = false; }); }, { passive: true });

pickHost(); applyMode(); render();
</script>

</body>
</html>
